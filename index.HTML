<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porsche | 911 GT2 RS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,400;100,500;125,700;125,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/BMW.CSS">
</head>
<body>

    <div class="stage">
        <img id="offLayer" class="layer" alt="Porsche 911 GT2 RS" draggable="false">
        <video id="videoLayer" class="layer" playsinline preload="auto"></video>
    </div>

    <div class="shade"></div>
    <div class="ad" aria-hidden="true">
        <div class="bar"></div>
        <h1 class="title" id="adTitle"></h1>
        <p class="text" id="adText"></p>
    </div>

    <div class="ignition">
        <button class="key-btn" id="keyBtn" type="button" aria-pressed="false" aria-label="Porsche key: start or stop engine">
            <img class="key-img" id="keyImg" alt="" draggable="false">
            <svg class="key-fallback" viewBox="0 0 100 100" aria-hidden="true">
                <defs>
                    <linearGradient id="kg" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#3b4350"/>
                        <stop offset="1" stop-color="#0d1015"/>
                    </linearGradient>
                </defs>
                <rect x="30" y="8" width="40" height="84" rx="18" fill="url(#kg)" stroke="#6b7482" stroke-width="1.5"/>
                <circle cx="50" cy="32" r="9" fill="#0d1015" stroke="#c9a45c" stroke-width="1.5"/>
                <circle cx="50" cy="32" r="4" fill="#d5001c"/>
                <rect x="40" y="56" width="20" height="8" rx="4" fill="#1a1e25" stroke="#4b5360"/>
                <rect x="40" y="70" width="20" height="8" rx="4" fill="#1a1e25" stroke="#4b5360"/>
            </svg>
        </button>
    </div>

<script src="BWM.JS"></script>
</body>
</html>
